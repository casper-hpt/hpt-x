# Data sources for the backtest package (src/algo_trading/backtest/config.py reads this).
# To switch datasets, set `dataset` to one of the names under `datasets` and restart the
# notebook kernel. Paths are relative to algo-trading/.

dataset: ohlcv_15m

datasets:
  # Long format, one row per (interval, ts, token_id): true 1d bars plus hourly bars.
  # Columns: interval,ts,token_id,open,high,low,close,volume,market_cap
  # Fetch with `python scripts/download_data.py`.
  historical:
    path: .data/historical_data.csv
    format: long
    hourly_start: "2026-05-25"   # default first bar for hourly_panel()

  # 15-minute OHLCV bars, one row per (dt, symbol); resampled to 1h and 1d on load.
  # Columns: <row index>,dt,timestamp,symbol,open,high,low,close,volume,trades
  # Fetch with `python scripts/download_data.py --dataset ohlcv_15m`.
  ohlcv_15m:
    path: .data/ohlcv_15m.csv
    format: ohlcv
    hourly_start: null           # null = from the first bar
