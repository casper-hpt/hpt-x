[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "algo-backtest-rs"
description = "Rust engine for algo_trading.backtest.simulate"
requires-python = ">=3.10"
dependencies = ["numpy>=2.1"]
dynamic = ["version"]

[tool.maturin]
module-name = "algo_backtest_rs"
features = ["pyo3/extension-module"]
